<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 230" width="100%" height="230" fill="none">
  <defs>
    <linearGradient id="beamGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0" />
      <stop offset="50%" stop-color="#10b981" stop-opacity="1" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </linearGradient>
    <clipPath id="cardClip">
      <rect width="800" height="230" rx="10" />
    </clipPath>
  </defs>

  <style>
    @keyframes blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes pulse {
      0% { transform: scale(1); opacity: 0.9; }
      50% { transform: scale(2.4); opacity: 0; }
      100% { transform: scale(2.4); opacity: 0; }
    }
    @keyframes shimmer {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(100%); }
    }
    .cursor {
      animation: blink 1s infinite;
    }
    .pulse-ring {
      transform-origin: 672px 19px;
      animation: pulse 2s cubic-bezier(0.24, 0, 0.38, 1) infinite;
    }
    .shimmer-bar {
      animation: shimmer 4s ease-in-out infinite;
    }
    .mono {
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
    }
  </style>

  <!-- Terminal Card Background -->
  <g clip-path="url(#cardClip)">
    <rect width="800" height="230" rx="10" fill="#0d1117" stroke="#30363d" stroke-width="1.5" />
    
    <!-- Animated Light Shimmer Top Border -->
    <rect x="0" y="0" width="800" height="2" fill="url(#beamGrad)" class="shimmer-bar" />

    <!-- Window Header Bar -->
    <rect x="0" y="0" width="800" height="38" fill="#161b22" />
    <line x1="0" y1="38" x2="800" y2="38" stroke="#30363d" stroke-width="1" />

    <!-- Window Control Dots -->
    <circle cx="22" cy="19" r="5" fill="#ff5f56" />
    <circle cx="38" cy="19" r="5" fill="#ffbd2e" />
    <circle cx="54" cy="19" r="5" fill="#27c93f" />

    <!-- Window Title -->
    <text x="400" y="23" fill="#8b949e" font-size="12" class="mono" text-anchor="middle">dillan@cit-u: ~ (zsh)</text>

    <!-- Pulsing Status Beacon -->
    <g>
      <circle cx="672" cy="19" r="3.5" fill="none" stroke="#10b981" stroke-width="1.5" class="pulse-ring" />
      <circle cx="672" cy="19" r="3.5" fill="#10b981" />
      <text x="684" y="23" fill="#10b981" font-size="11" font-weight="600" class="mono">AVAILABLE 2027</text>
    </g>

    <!-- Terminal Body Commands & Outputs -->
    <!-- Line 1: Role -->
    <text x="25" y="70" fill="#58a6ff" font-size="13" font-weight="600" class="mono">❯ dillan --specialization</text>
    <text x="25" y="92" fill="#f0f6fc" font-size="13" class="mono">Full-Stack &amp; Mobile Developer · Distributed Systems Architecture</text>

    <!-- Line 2: Stack -->
    <text x="25" y="124" fill="#58a6ff" font-size="13" font-weight="600" class="mono">❯ dillan --tech-stack</text>
    <text x="25" y="146" fill="#3fb950" font-size="13" class="mono">Spring Boot 3</text>
    <text x="142" y="146" fill="#8b949e" font-size="13" class="mono">·</text>
    <text x="156" y="146" fill="#3fb950" font-size="13" class="mono">FastAPI</text>
    <text x="222" y="146" fill="#8b949e" font-size="13" class="mono">·</text>
    <text x="236" y="146" fill="#3fb950" font-size="13" class="mono">Next.js 15</text>
    <text x="323" y="146" fill="#8b949e" font-size="13" class="mono">·</text>
    <text x="337" y="146" fill="#3fb950" font-size="13" class="mono">Kotlin Compose</text>
    <text x="468" y="146" fill="#8b949e" font-size="13" class="mono">·</text>
    <text x="482" y="146" fill="#3fb950" font-size="13" class="mono">pgvector</text>
    <text x="557" y="146" fill="#8b949e" font-size="13" class="mono">·</text>
    <text x="571" y="146" fill="#3fb950" font-size="13" class="mono">Docker &amp; AWS</text>

    <!-- Line 3: Focus & Prompt -->
    <text x="25" y="178" fill="#58a6ff" font-size="13" font-weight="600" class="mono">❯ dillan --status</text>
    <text x="25" y="200" fill="#8b949e" font-size="13" class="mono">CIT-U BSIT 4th Year · Building AI &amp; High-Throughput Microservices</text>
    <rect x="585" y="188" width="8" height="15" fill="#10b981" class="cursor" />
  </g>
</svg>
